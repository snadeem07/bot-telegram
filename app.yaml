# Google App Engine Configuration for Telegram Expense Tracker Bot

runtime: python311

# Instance class - F1 is the default free tier
instance_class: F1

# Automatic scaling configuration
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 5
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 50

# Entry point
entrypoint: gunicorn -b :$PORT main:app

# Environment variables
# Note: Sensitive values should be set via Google Cloud Console or Secret Manager
env_variables:
  # Telegram Bot Token (set this in Google Cloud Console)
  # TELEGRAM_BOT_TOKEN: "your-bot-token-here"

  # Webhook URL (your App Engine URL)
  # WEBHOOK_URL: "https://your-project-id.appspot.com"

  # Database configuration
  # For Cloud SQL, use the connection name
  # CLOUD_SQL_CONNECTION_NAME: "project-id:region:instance-name"
  # DB_NAME: "your-database-name"
  # DB_USER: "your-database-user"
  # DB_PASSWORD: "your-database-password"

  # Optional: For development/staging
  # DB_HOST: "/cloudsql/project-id:region:instance-name"
  # DB_PORT: "5432"

  PYTHON_ENV: "production"

# Handlers
handlers:
  # Main application
  - url: /.*
    script: auto
    secure: always

# Cloud SQL instance connection
# Uncomment and configure for Cloud SQL
# beta_settings:
#   cloud_sql_instances: "project-id:region:instance-name"

# VPC connector (if using VPC)
# vpc_access_connector:
#   name: "projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME"
